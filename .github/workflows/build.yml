name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          LATEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project LifeTimer.xcodeproj \
            -scheme LifeTimer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/LifeTimer.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LifeTimer.ipa Payload
          ls -la LifeTimer.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeTimer-ipa
          path: LifeTimer.ipa
          if-no-files-found: error
